<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявки — О.Б.Р</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css?v=4">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <section class="section">
      <div class="section-head">
        <h2 id="apps-title">Мои заявки</h2>
        <div class="line"></div>
        <a id="back-link" class="btn small" href="/#join-section">Подать заявление</a>
      </div>

      <div id="alert" class="alert"></div>
      <div id="apps-list"></div>
    </section>
  </main>

  <!-- Модалка одобрения заявки на вступление -->
  <div class="modal-backdrop" id="approve-modal" style="display:none">
    <div class="modal">
      <h3>Одобрить вступление</h3>
      <p class="muted" id="approve-applicant" style="margin-top:-4px"></p>
      <div id="approve-alert" class="alert"></div>
      <form id="approve-form">
        <div class="form-row">
          <label>Номер сотрудника</label>
          <input type="text" id="a-number" required maxlength="20" placeholder="Например: ОБР-002">
        </div>
        <div class="form-row">
          <label>Позывной</label>
          <input type="text" id="a-callsign" required maxlength="40" placeholder="Позывной">
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label>Звание</label>
            <select id="a-rank"></select>
          </div>
          <div class="form-row">
            <label>Должность</label>
            <select id="a-position"></select>
          </div>
          <div class="form-row">
            <label>Возраст (из заявки)</label>
            <input type="text" id="a-age" maxlength="10" placeholder="Возраст">
          </div>
          <div class="form-row">
            <label>Discord (из заявки)</label>
            <input type="text" id="a-discord" maxlength="60" placeholder="@username">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">Добавить в штат</button>
          <button type="button" class="btn" onclick="closeApproveModal()">Отмена</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Модалка редактирования текста заявки -->
  <div class="modal-backdrop" id="edit-modal" style="display:none">
    <div class="modal">
      <h3>Редактировать заявку</h3>
      <div id="edit-alert" class="alert"></div>
      <form id="edit-form">
        <div class="form-row">
          <label>Текст заявки</label>
          <textarea id="e-text" rows="5" maxlength="2000"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">Сохранить</button>
          <button type="button" class="btn" onclick="closeEditModal()">Отмена</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <a class="discord-icon" href="https://discord.gg/FAyaC5puP9" target="_blank" rel="noopener" title="Discord О.Б.Р" aria-label="Discord">
        <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418z"/></svg>
      </a>
      <span>О.Б.Р — Отряд Быстрого Реагирования</span>
    </div>
  </footer>

  <script src="/js/common.js?v=4"></script>
  <script src="/js/applications.js?v=4"></script>
</body>
</html>
